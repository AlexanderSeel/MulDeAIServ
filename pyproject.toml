[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muldeaiserv"
version = "0.2.0"
description = "Hardware-aware private AI model cluster control plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
muldeaiserv = "muldeaiserv.cli:main"
muldeaiserv-agent = "muldeaiserv.agent:main"

[tool.setuptools.packages.find]
include = ["muldeaiserv*"]

[tool.setuptools.package-data]
muldeaiserv = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
