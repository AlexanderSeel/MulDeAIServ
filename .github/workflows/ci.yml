name: Python test and package
on:
  push:
  pull_request:
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: JavaScript syntax
        if: runner.os == 'Linux'
        run: node --check muldeaiserv/static/app.js
      - name: Compile
        run: python -m compileall -q muldeaiserv
      - name: Tests
        run: pytest -q
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
